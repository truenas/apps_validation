name: build_image

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SLIM_TAG: ghcr.io/truenas/apps_validation:slim
  FULL_TAG: ghcr.io/truenas/apps_validation:latest

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.docker_build.outputs.digest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.FULL_TAG }}
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  # The same image without the parts of the TrueNAS rootfs that rendering and validating apps never use
  slim:
    needs: docker
    runs-on: ubuntu-latest
    env:
      # By digest, so a newer push to latest in the meantime doesn't get pruned instead
      SOURCE_IMAGE: ghcr.io/truenas/apps_validation@${{ needs.docker.outputs.digest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The full image is ~13 GB and the flattened copy needs room next to it
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull
        run: docker pull --platform linux/amd64 "$SOURCE_IMAGE"

      # Deleting files in a layer doesn't shrink an image, flattening it does.
      # docker import drops the image config, so it is copied over from the source image.
      - name: Prune and flatten
        run: |
          docker run --platform linux/amd64 --name prune \
            -v "$PWD/.github/scripts/prune_image.sh:/prune_image.sh:ro" \
            --entrypoint bash "$SOURCE_IMAGE" /prune_image.sh

          changes=()

          # One entry per line, so values with spaces stay whole
          mapfile -t envs < <(docker image inspect "$SOURCE_IMAGE" --format '{{join .Config.Env "\n"}}')
          for env in "${envs[@]}"; do
            changes+=(--change "ENV $env")
          done

          changes+=(--change "WORKDIR $(docker image inspect "$SOURCE_IMAGE" --format '{{.Config.WorkingDir}}')")
          changes+=(--change "CMD $(docker image inspect "$SOURCE_IMAGE" --format '{{json .Config.Cmd}}')")

          docker export prune | docker import --platform linux/amd64 "${changes[@]}" - "$SLIM_TAG"
          docker rm prune
          docker image ls

      - name: Push
        run: docker push "$SLIM_TAG"

      - name: Image digest
        run: docker image inspect "$SLIM_TAG" --format '{{index .RepoDigests 0}}'
